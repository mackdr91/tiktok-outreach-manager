# Author: Domonick Mack
# Date: 2026-11-15
# Description: Docker Compose orchestration for local development and containerized testing of TokReach.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tokreach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tokreach
      POSTGRES_PASSWORD: tokreach_password
      POSTGRES_DB: tokreach_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokreach -d tokreach_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tokreach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tokreach-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://tokreach:tokreach_password@postgres:5432/tokreach_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "${JWT_SECRET:-tokreach-super-secret-jwt-signing-key-change-in-production}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run db:seed && npm run start"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tokreach-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://tokreach:tokreach_password@postgres:5432/tokreach_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["npm", "run", "worker"]

volumes:
  postgres_data:
  redis_data:
